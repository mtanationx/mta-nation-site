<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#101820">
<title>Avalia a tua compra · MTA Nation</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f6;font-family:Poppins,system-ui,sans-serif;color:#101820}
.top{background:#000;padding:22px 0;text-align:center}.top img{height:56px}
.wrap{max-width:520px;margin:0 auto;padding:18px 14px 40px}
h1{font-family:Montserrat,sans-serif;font-size:18px;letter-spacing:.12em;text-align:center;margin:8px 0 4px}
.sub{text-align:center;color:#666;font-size:14px;margin:0 0 18px}
.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:12px}
.item{display:flex;gap:12px;align-items:center}
.item img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#eee;flex:none}
.item b{font-size:14px}
.st{display:flex;gap:4px;margin:8px 0}
.st button{border:0;background:none;font-size:38px;line-height:1;color:#d6d6d6;cursor:pointer;padding:0 2px}
.st button.on{color:#2E7D4F}
.ph{display:flex;align-items:center;gap:10px;margin-top:8px}.ph label{border:1.5px dashed #c9cbcd;border-radius:10px;padding:9px 13px;font-size:14px;cursor:pointer;margin:0;text-transform:none;letter-spacing:0;font-weight:500;color:#333}.ph img{width:52px;height:52px;object-fit:cover;border-radius:8px}
textarea,input{width:100%;font:inherit;padding:11px 12px;border:1px solid #e3e4e5;border-radius:10px;background:#fff}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#777;margin:12px 0 6px}
.btn{display:block;width:100%;background:#101820;color:#fff;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:600;font-size:16px;cursor:pointer;margin-top:16px}
.btn:disabled{opacity:.5}
.err{color:#c62828;font-size:14px;min-height:20px;margin-top:10px;text-align:center}
.hp{position:absolute;left:-9999px}
.ok{text-align:center;padding:30px 10px}.ok .big{font-size:52px}
.pcs{display:flex;gap:10px;overflow-x:auto}.pc{flex:none;width:84px;text-align:center;font-size:11.5px;line-height:1.25}.pc img{width:84px;height:84px;border-radius:10px;object-fit:cover;background:#eee;display:block;margin-bottom:5px}
.res button{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid #eee;background:none;padding:8px 2px;font:inherit;font-size:14px;text-align:left;cursor:pointer}.res img{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#eee}.res small{color:#999;margin-left:auto}.pc[data-rm]{cursor:pointer}
.note{font-size:12px;color:#888;text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="top"><a href="/"><img src="/img/logo.png" alt="MTA Nation" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'MTA NATION',style:'color:#fff;letter-spacing:.3em'}))"></a></div>
<div class="wrap" id="app"><p class="sub">A carregar…</p></div>
<script>
const q=new URLSearchParams(location.search), S=q.get("s"), K=q.get("k"), app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shrink(file){ return new Promise((res,rej)=>{ const img=new Image(), u=URL.createObjectURL(file); img.onload=()=>{ const k=Math.min(1,1080/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",0.72)); }; img.onerror=()=>rej(new Error("Foto inválida")); img.src=u; }); }
function stars(key){ return `<div class="st" data-key="${key}">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" aria-label="${n} estrelas">★</button>`).join("")}</div>`; }
if(!S||!K){ openForm(); } else
fetch(`/api/reviews/sale?s=${encodeURIComponent(S||"")}&k=${encodeURIComponent(K||"")}`).then(r=>r.json().then(d=>({ok:r.ok,d}))).then(({ok,d})=>{
  if(!ok){ app.innerHTML=`<div class="card ok"><div class="big">🔗</div><h1>LINK INVÁLIDO</h1><p class="sub">Este link de avaliação não é válido. Fala connosco pelo WhatsApp.</p></div>`; return; }
  if(d.done){ app.innerHTML=`<div class="card ok"><div class="big">🖤</div><h1>OBRIGADO!</h1><p class="sub">Esta compra já foi avaliada.</p><a class="btn" href="/">Ver catálogo</a></div>`; return; }
  const many=d.items.length>1;
  app.innerHTML=`<h1>AVALIA A TUA COMPRA</h1><p class="sub">${d.customer?`Olá ${esc(d.customer)}! `:""}Só demora 1 minuto. A tua opinião ajuda outros clientes.</p>
    <div class="card"><label style="margin-top:0">${many?"As tuas peças":"A tua peça"}</label><div class="pcs">${d.items.map(it=>`<div class="pc"><img src="/img/t/${esc(it.product_id)}.jpg" alt="" onerror="this.style.visibility='hidden'"><span>${esc(it.name)}</span></div>`).join("")}</div></div>
    <div class="card"><b>${many?"O que achaste das peças e do atendimento?":"O que achaste da peça e do atendimento?"}</b>${stars("all")}
      <textarea id="tx" placeholder="Conta-nos em poucas palavras (opcional)"></textarea>
      <div class="ph"><label>📷 Adicionar foto<input type="file" accept="image/*" id="ph" hidden></label><span id="pv" style="font-size:12px;color:#888">opcional · tu com ${many?"as peças":"a peça"}</span></div></div>
    <div class="card"><label style="margin-top:0">O teu nome (aparece assim no site)</label><input id="nm" placeholder="ex: Danilo M." maxlength="40"><label>Cidade</label><input id="ct" placeholder="ex: Maputo (opcional)" maxlength="40"><input class="hp" id="hp" tabindex="-1" autocomplete="off"></div>
    <button class="btn" id="go">Enviar avaliação</button><div class="err" id="err"></div>
    <p class="note">Escreves só uma vez${many?" e nós juntamos a tua avaliação a cada peça":""}. As avaliações são revistas antes de aparecerem no site.</p>`;
  let rating=0, photo=null;
  document.querySelectorAll(".st button").forEach(b=>b.onclick=()=>{ rating=+b.dataset.n; document.querySelectorAll(".st button").forEach(x=>x.classList.toggle("on",+x.dataset.n<=rating)); });
  document.getElementById("ph").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; const pv=document.getElementById("pv"); pv.textContent="A preparar…"; try{ photo=await shrink(f); pv.innerHTML=`<img src="${photo}" alt="">`; }catch(x){ pv.textContent=x.message; } };
  document.getElementById("go").onclick=async e=>{
    const err=document.getElementById("err"); err.textContent="";
    if(!rating){ err.textContent="Toca nas estrelas para avaliar."; return; }
    const name=document.getElementById("nm").value.trim(); if(!name){ err.textContent="Escreve o teu nome."; return; }
    e.target.disabled=true; e.target.textContent="A enviar…";
    try{ const r=await fetch("/api/reviews/submit",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({s:S,k:K,name,city:document.getElementById("ct").value.trim(),rating,text:document.getElementById("tx").value.trim(),photo,website:document.getElementById("hp").value})}); const x=await r.json(); if(!r.ok) throw new Error(x.error||"Erro");
      app.innerHTML=`<div class="card ok"><div class="big">🖤</div><h1>OBRIGADO!</h1><p class="sub">A tua avaliação foi recebida.</p><a class="btn" href="/">Ver catálogo</a></div>`;
    }catch(x){ err.textContent=x.message; e.target.disabled=false; e.target.textContent="Enviar avaliação"; }
  };
}).catch(()=>{ app.innerHTML=`<p class="sub">Não foi possível carregar. Tenta de novo.</p>`; });

async function openForm(){
  let rating=0, photo=null;
  app.innerHTML=`<h1>AVALIA A MTA NATION</h1><p class="sub">Já compraste connosco? Conta-nos como foi. Só demora 1 minuto.</p>
    <div class="card"><b>Como foi a tua experiência com a MTA Nation?</b>${stars("all")}
      <textarea id="tx" placeholder="O atendimento, as peças, a entrega… conta-nos em poucas palavras"></textarea>
      <div class="ph"><label>📷 Adicionar foto<input type="file" accept="image/*" id="ph" hidden></label><span id="pv" style="font-size:12px;color:#888">opcional · tu com a peça</span></div></div>
    <div class="card"><label style="margin-top:0">O teu nome (aparece assim no site)</label><input id="nm" placeholder="ex: Danilo M." maxlength="40"><label>Cidade</label><input id="ct" placeholder="ex: Maputo" maxlength="40"><input class="hp" id="hp" tabindex="-1" autocomplete="off"></div>
    <button class="btn" id="go">Enviar avaliação</button><div class="err" id="err"></div>
    <p class="note">As avaliações são revistas antes de aparecerem no site.</p>`;
  document.querySelectorAll(".st button").forEach(b=>b.onclick=()=>{ rating=+b.dataset.n; document.querySelectorAll(".st button").forEach(x=>x.classList.toggle("on",+x.dataset.n<=rating)); });
  document.getElementById("ph").onchange=async e=>{ const f=e.target.files[0]; if(!f) return; const pv=document.getElementById("pv"); pv.textContent="A preparar…"; try{ photo=await shrink(f); pv.innerHTML=`<img src="${photo}" alt="">`; }catch(x){ pv.textContent=x.message; } };
  document.getElementById("go").onclick=async e=>{ const err=document.getElementById("err"); err.textContent="";
    if(!rating){ err.textContent="Toca nas estrelas para avaliar."; return; }
    const name=document.getElementById("nm").value.trim(); if(!name){ err.textContent="Escreve o teu nome."; return; }
    const text=document.getElementById("tx").value.trim(); if(text.length<3){ err.textContent="Escreve um pequeno comentário."; return; }
    e.target.disabled=true; e.target.textContent="A enviar…";
    try{ const r=await fetch("/api/reviews/open",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({rating,text,name,city:document.getElementById("ct").value.trim(),photo,website:document.getElementById("hp").value})}); const x=await r.json(); if(!r.ok) throw new Error(x.error||"Erro");
      app.innerHTML=`<div class="card ok"><div class="big">🖤</div><h1>OBRIGADO!</h1><p class="sub">A tua avaliação foi recebida.</p><a class="btn" href="/">Ver catálogo</a></div>`;
    }catch(x){ err.textContent=x.message; e.target.disabled=false; e.target.textContent="Enviar avaliação"; } };
}
</script>
</body>
</html>
