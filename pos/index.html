<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#101820">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>MTA POS</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#101820;--mut:#6b7075;--line:#e6e7e8;--bg:#f5f5f4;--red:#c62828;--grn:#1e8e3e;--gold:#c9a24a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
h1,h2,h3,.mont{font-family:Montserrat,Poppins,sans-serif;letter-spacing:.04em}
.hide{display:none!important}
/* topo */
.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:6px;padding:0 10px;height:56px;position:sticky;top:0;z-index:20}
.top .lg{font-family:Montserrat;font-weight:800;letter-spacing:.18em;font-size:15px;margin-right:8px;white-space:nowrap}
.nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{color:#aab;padding:8px 12px;border-radius:8px;font-weight:600;white-space:nowrap;font-size:14px}
.nav button.on{background:#ffffff1a;color:#fff}
.who{font-size:12px;color:#ccd;white-space:nowrap;display:flex;align-items:center;gap:8px}
.who button{color:#fff;border:1px solid #ffffff40;border-radius:8px;padding:5px 9px;font-size:12px}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);padding:20px}
.lbox{background:#fff;border-radius:20px;padding:28px 24px;width:100%;max-width:340px;text-align:center}
.lbox h1{margin:0 0 4px;font-size:20px;letter-spacing:.2em}
.lbox p{color:var(--mut);margin:0 0 18px;font-size:13px}
.dots{display:flex;gap:12px;justify-content:center;margin:6px 0 18px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.dots i.f{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:62px;border-radius:14px;background:var(--bg);font-size:22px;font-weight:600}
.pad button:active{background:#e3e4e5}
.lerr{color:var(--red);min-height:20px;font-size:13px;margin-top:10px}
.lbox input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
/* geral */
.wrap{max-width:1200px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:14px;padding:14px;border:1px solid var(--line)}
.btn{background:var(--ink);color:#fff;border-radius:12px;padding:12px 16px;font-weight:600}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.grn{background:var(--grn)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.4}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}
.muted{color:var(--mut)}
.small{font-size:12px}
.fmt{white-space:nowrap}
input.f,select.f,textarea.f{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
label.l{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:12px 0 6px}
/* vender */
.sell{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}
.sell>div{min-width:0}
html,body{overflow-x:hidden}
.srch{position:sticky;top:56px;background:var(--bg);padding:2px 0 10px;z-index:5}
.srch input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);font-size:16px}
.cats{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pc{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.pc img,.pc .ni{width:100%;aspect-ratio:1;object-fit:cover;background:#f0f0ef;display:block}
.pc .ni{display:flex;align-items:center;justify-content:center;color:#bbb;font-size:11px}
.pc b{font-size:12.5px;padding:7px 8px 0;line-height:1.25}
.pc span{font-size:12px;padding:2px 8px 8px;color:var(--mut)}
.pc .st{color:var(--red);font-weight:700;font-size:11px;padding:0 8px 8px}
.cart{position:sticky;top:70px}
.cart h3{margin:0 0 10px;font-size:14px;letter-spacing:.12em}
.ci{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ci b{font-size:13.5px}
.ci .v{font-size:12px;color:var(--mut)}
.ci .ctl{display:flex;align-items:center;gap:6px;grid-column:1/3}
.ci .ctl input{width:92px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;text-align:right}
.qbtn{width:30px;height:30px;border-radius:8px;background:var(--bg);font-weight:700}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin:12px 0}
.disc{font-size:12px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:30px 0;font-size:13px}
.cartbar{display:none}
/* modal */
.mod{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.mbox{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:700px){.mod{align-items:center}.mbox{border-radius:18px}}
.mbox h2{margin:0 0 2px;font-size:18px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;font-weight:600;min-width:52px;position:relative;background:#fff}
.opt.on{border-color:var(--ink);background:var(--ink);color:#fff}
.opt small{display:block;font-size:10px;font-weight:600;opacity:.75}
.opt.zero small{color:var(--red);opacity:1}
.opt.on.zero small{color:#ffb4b4}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* fecho */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi small{display:block;color:var(--mut);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.kpi b{font-size:20px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:8px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tr.void td{opacity:.45;text-decoration:line-through}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--bg)}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}
.sec-h h3{margin:0;font-size:13px;letter-spacing:.12em}
/* stock */
.sr{display:grid;grid-template-columns:1fr 70px 70px 110px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.sr input{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;text-align:center}
.sr input.low{color:var(--red);font-weight:700}
.sr input.chg{border-color:var(--gold);background:#fff8e6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:90;font-size:14px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.ok{text-align:center;padding:10px 0}
.ok .big{font-size:46px}
@media(max-width:860px){
  .sell{grid-template-columns:1fr}
  .cart{position:fixed;inset:56px 0 0 0;z-index:30;border-radius:0;overflow:auto;display:none}
  .cart.open{display:block}
  .cartbar{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:25;background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;justify-content:space-between;font-weight:600;box-shadow:0 6px 20px #0004}
  .wrap.pb{padding-bottom:90px}
  .sr{grid-template-columns:1fr 60px 60px 92px}
  .toast{bottom:96px}
  .who span{display:none}
  .top .lg{font-size:12px;letter-spacing:.1em;margin-right:2px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* ===== util ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>(Math.round(n||0)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".")+" MT";
const COR={ouro:"Dourado",prata:"Prateado","-":""};
const CORS={ouro:"D",prata:"P"};
const PAYS=["Cash","POS","M-Pesa","e-Mola","BIM","BCI","Transferência","Outro"];
const SOURCES=["Cliente habitual","Passou na loja","WhatsApp","Instagram","Facebook","Recomendação","Outro"];
const CTYPES=["Mensagem a clientes (POS)","Lista de transmissão WhatsApp","Status WhatsApp"];
const GCATS=["Renda / Glória Mall","Salários e comissões","Contabilidade e impostos","Marketing e anúncios","Entregas (moto boy)","Limpeza e manutenção","Software e serviços","Embalagens","Transporte","Outros"];
const GPAY=["Cash","M-Pesa","e-Mola","BCI","BIM","Transferência","Cartão","Outro"];
const LSTAT=["Por receber","Em trânsito","Chegou (por levantar)","Recebido"];
const LPAY=["Alipay","WeChat Pay","USDT","Transferência bancária","Revolut","Cartão","Cash","M-Pesa","e-Mola","Outro"];
const LBRAND=["MTA","Magnolia","Alekso","Loja","Pessoal"];
const DOWS=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const hmFmt=m=>{m=Math.round(m||0);return m>=60?`${Math.floor(m/60)}h${String(m%60).padStart(2,"0")}`:`${m} min`;};
const ROLES={seller:"Vendedor",manager:"Gerente",admin:"Admin"};
const EXP_TYPES=["Portador diário","Internet (dados)","Yango","Outros"];
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2600);}
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function dmy(day){const [y,m,d]=day.split("-");return `${d}/${m}/${y}`;}
function hm(ts){return new Date(ts).toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit",timeZone:"Africa/Maputo"});}
/* Validação de telefone: Moçambique = 9 dígitos a começar por 82–87 (ou com 258 à frente). Estrangeiro: começar por + ou 00. */
function phoneCheck(raw){
  const t=String(raw||"").trim(); if(!t) return {ok:true,empty:true};
  let d=t.replace(/\D/g,"");
  const intl=/^(\+|00)/.test(t); if(t.startsWith("00")) d=d.slice(2);
  if(d.startsWith("258")){ const n=d.slice(3); if(n.length!==9) return {ok:false,msg:`Número de Moçambique com ${n.length} dígitos depois do 258. Tem de ter 9 (ex: +258 84 123 4567).`}; d=n; }
  else if(intl) return d.length>=8&&d.length<=15?{ok:true,norm:d}:{ok:false,msg:"Número estrangeiro inválido. Confirma o indicativo e os dígitos."};
  if(d.length!==9) return {ok:false,msg:`O número tem ${d.length} ${d.length===1?"dígito":"dígitos"}. Um número de Moçambique tem 9 (ex: 84 123 4567).${d.length>9?" Há dígitos a mais.":" Faltam dígitos."}`};
  if(!/^8[2-7]/.test(d)) return {ok:false,msg:"Um número de Moçambique começa por 82, 83, 84, 85, 86 ou 87. Para número estrangeiro, começa com + e o indicativo (ex: +27…)."};
  return {ok:true,norm:"258"+d};
}
function waNum(p){let d=String(p||"").replace(/\D/g,""); if(d.length===9&&/^8/.test(d)) d="258"+d; return d;}

/* Promoção: mesmas fases do site (público) */
function promoPct(){
  const s=S.settings||{}; if(s.promo_pct!=null&&s.promo_pct!=="") return +s.promo_pct;
  const now=Date.now(), T1=Date.parse("2026-11-23T00:00:00+02:00"), T2=Date.parse("2026-12-01T00:00:00+02:00");
  return now<T1?30:(now<T2?15:0);
}
function vipPct(){ const now=Date.now(), T1=Date.parse("2026-11-23T00:00:00+02:00"), T2=Date.parse("2026-12-01T00:00:00+02:00"); return now<T1?50:(now<T2?25:0); }
const NOPROMO=new Set(["Conjuntos"]);

/* ===== estado ===== */
const S={token:LS.get("posTok",null),user:null,products:[],stock:{},users:[],settings:{},today:"",
  tab:"vender",cat:"Todos",q:"",cart:LS.get("posCart",[]),disc:LS.get("posDisc",0),vip:false,day:null,fecho:null};
function stk(id,cor,size){const r=S.stock[`${id}|${cor}|${size}`];return r==null?null:r;}
function stkTotal(id){let n=0,any=false,full=true;for(const k in S.stock){if(k.startsWith(id+"|")){any=true;const v=S.stock[k];if(v==null)full=false;else n+=v;}}return any&&full?n:null;}

async function api(path,opt={}){
  const r=await fetch("/api"+path,{method:opt.method||"GET",headers:{"content-type":"application/json",...(S.token?{authorization:"Bearer "+S.token}:{})},body:opt.body?JSON.stringify(opt.body):undefined});
  let d={}; try{d=await r.json()}catch(e){}
  if(r.status===401&&path!=="/login"){S.token=null;LS.set("posTok",null);render();throw new Error(d.error||"Sessão expirada");}
  if(!r.ok) throw new Error(d.error||("Erro "+r.status));
  return d;
}
async function boot(){
  const d=await api("/boot"); S.user=d.user; S.users=d.users; S.settings=d.settings; S.today=d.today; S.day=S.day||d.today;
  S.stock={}; d.stock.forEach(r=>S.stock[`${r.product_id}|${r.cor}|${r.size}`]=r.qty);
  if(!S.products.length) S.products=await (await fetch("products.json",{cache:"no-cache"})).json();
  const pp=S.settings.prices?JSON.parse(S.settings.prices):{}; S.products.forEach(p=>{ if(pp[p.id]!=null) p.price=+pp[p.id]; });
}

/* ===== render ===== */
function render(){
  const app=$("#app");
  if(!S.token){ return renderLogin(app); }
  if(!S.user){ app.innerHTML=`<div class="login"><div class="lbox"><p>A carregar…</p></div></div>`; boot().then(render).catch(e=>{toast(e.message)}); return; }
  const admin=S.user.role==="admin";
  const mgr=admin||S.user.role==="manager";
  const tabs=[["vender","Vender"],["fecho","Fecho"]].concat(mgr?[["caixa","Caixa"],["clientes","Clientes"],["campanhas","Marketing"]]:[],[["stock","Stock"]],mgr?[["logistica","Logística"],["ponto","Ponto"],["gastos","Givings"]]:[],admin?[["relatorio","Relatório"],["equipa","Equipa"]]:[]);
  app.innerHTML=`<div class="top"><span class="lg">MTA POS</span><div class="nav">${tabs.map(([k,l])=>`<button data-tab="${k}" class="${S.tab===k?"on":""}">${l}</button>`).join("")}</div>
    <div class="who"><button id="clk" title="Marcar entrada/saída">🕘 Ponto</button><span>${esc(S.user.name)}</span><button id="out">Sair</button></div></div><div id="view"></div>`;
  $$("[data-tab]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render();});
  $("#clk").onclick=clockModal;
  $("#out").onclick=async()=>{try{await api("/logout",{method:"POST"})}catch(e){} S.token=null;S.user=null;LS.set("posTok",null);render();};
  ({vender:vVender,fecho:vFecho,caixa:vCaixa,ponto:vPonto,logistica:vLog,gastos:vGastos,clientes:vClientes,campanhas:vCampanhas,stock:vStock,relatorio:vRel,equipa:vEquipa})[S.tab]($("#view"));
}

/* ----- login ----- */
async function renderLogin(app){
  let setup=false; try{ setup=(await api("/status")).setup; }catch(e){ app.innerHTML=`<div class="login"><div class="lbox"><h1>MTA POS</h1><p class="lerr">${esc(e.message)}</p></div></div>`; return; }
  if(setup){
    app.innerHTML=`<div class="login"><div class="lbox"><h1>MTA POS</h1><p>Primeira configuração: cria a conta de administrador.</p>
      <input id="sn" placeholder="O teu nome" autocomplete="off"><input id="sp" placeholder="PIN (4–8 dígitos)" inputmode="numeric" type="password" autocomplete="off">
      <button class="btn" id="sb" style="width:100%">Criar conta</button><div class="lerr" id="le"></div></div></div>`;
    $("#sb").onclick=async()=>{ try{ await api("/setup",{method:"POST",body:{name:$("#sn").value,pin:$("#sp").value}}); toast("Conta criada. Entra com o teu PIN."); render(); }catch(e){ $("#le").textContent=e.message; } };
    return;
  }
  let pin="";
  app.innerHTML=`<div class="login"><div class="lbox"><h1>MTA POS</h1><p>Introduz o teu PIN</p><div class="dots" id="dots"></div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9,"⌫",0,"OK"].map(k=>`<button data-k="${k}">${k}</button>`).join("")}</div><div class="lerr" id="le"></div>${LS.get("posDevice",null)?`<button class="btn sec" id="lclk" style="width:100%;margin-top:6px">🕘 Marcar entrada / saída</button>`:""}</div></div>`;
  const draw=()=>{$("#dots").innerHTML=Array.from({length:Math.max(4,pin.length)},(_,i)=>`<i class="${i<pin.length?"f":""}"></i>`).join("");};
  const go=async()=>{ if(pin.length<4) return; try{ const d=await api("/login",{method:"POST",body:{pin}}); S.token=d.token; LS.set("posTok",d.token); S.user=null; S.tab="vender"; render(); }catch(e){ $("#le").textContent=e.message; pin=""; draw(); } };
  const lc=$("#lclk"); if(lc) lc.onclick=clockModal;
  $$("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k; if(k==="⌫") pin=pin.slice(0,-1); else if(k==="OK") return go(); else if(pin.length<8) pin+=k; $("#le").textContent=""; draw(); if(pin.length===8) go();});
  document.onkeydown=e=>{ if(S.token) return; if(/^\d$/.test(e.key)&&pin.length<8){pin+=e.key;draw();} else if(e.key==="Backspace"){pin=pin.slice(0,-1);draw();} else if(e.key==="Enter") go(); };
  draw();
}

/* ----- vender ----- */
function listPrice(p){ return p.price||0; }
function salePrice(p){ const lp=listPrice(p); if(NOPROMO.has(p.cat)) return lp; const pct=S.vip?vipPct():promoPct(); return Math.round(lp*(100-pct)/100); }
function saveCart(){ if(!S.cart.length) S.disc=0; LS.set("posCart",S.cart); LS.set("posDisc",S.disc); }
const cartGross=()=>S.cart.reduce((a,i)=>a+i.unit_price*i.qty,0);
const cartTotal=()=>Math.max(0,cartGross()-(S.disc||0));
function vVender(v){
  const cats=["Todos",...new Set(S.products.map(p=>p.cat))];
  v.innerHTML=`<div class="wrap pb"><div class="sell"><div>
    <div class="srch"><input id="q" placeholder="Pesquisar artigo… (ex: grego, rope 3, cuban)" value="${esc(S.q)}" autocomplete="off">
    <div class="cats">${cats.map(c=>`<button class="chip ${S.cat===c?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div></div>
    <div class="grid" id="grid"></div></div>
    <div class="card cart" id="cart"></div></div></div>
    <button class="cartbar" id="cbar"></button>`;
  $("#q").oninput=e=>{S.q=e.target.value;drawGrid();};
  $$("[data-c]").forEach(b=>b.onclick=()=>{S.cat=b.dataset.c;$$("[data-c]").forEach(x=>x.classList.toggle("on",x===b));drawGrid();});
  $("#cbar").onclick=()=>$("#cart").classList.add("open");
  drawGrid(); drawCart();
}
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/([a-z])(\d)/g,"$1 $2");
function drawGrid(){
  const q=norm(S.q).trim().split(/\s+/).filter(Boolean);
  const list=S.products.filter(p=>(S.cat==="Todos"||p.cat===S.cat)&&q.every(w=>norm(p.name+" "+p.cat+" "+p.tipo+" "+p.id).includes(w)));
  $("#grid").innerHTML=list.map(p=>{const t=stkTotal(p.id);

/* ----- caixa ----- */
async function vCaixa(v){

  let c; try{ c=await api("/cash"); }catch(e){ $("#cb").innerHTML=`<p class="empty">${esc(e.message)}</p>`; return; }
  const sIn=c.sales.reduce((a,x)=>a+x.subtotal+x.delivery,0), sOut=c.expenses.reduce((a,x)=>a+x.amount,0);
  const desde=c.last?`${dmy(c.last.day)} às ${hm(c.last.ts)} (${esc(c.last.by_name||"")})`:"o início";
  $("#cb").innerHTML=`<div class="card" style="text-align:center;padding:22px"><div class="muted small" style="letter-spacing:.1em;text-transform:uppercase;font-weight:700">Cash na loja agora</div>
      <div style="font-size:38px;font-weight:800;margin:6px 0">${fmt(c.balance)}</div><div class="small muted">Desde a última recolha: ${desde}</div>
      <button class="btn grn" id="rc" style="margin-top:14px;width:100%;max-width:360px" ${c.balance>0?"":"disabled"}>Registar recolha de cash</button></div>
    <div class="sec-h"><h3 class="mont">DESDE A ÚLTIMA RECOLHA</h3></div>
    <div class="card"><table class="t"><tr><th>Quando</th><th>Movimento</th><th>Valor</th></tr>
      ${c.sales.map(x=>`<tr><td class="small">${dmy(x.day)} ${hm(x.ts)}</td><td>Venda cash · ${esc(x.seller)}${x.customer?` · ${esc(x.customer)}`:""}</td><td class="fmt" style="color:var(--grn)">+ ${fmt(x.subtotal+x.delivery)}</td></tr>`).join("")}
      ${c.expenses.map(x=>`<tr><td class="small">${dmy(x.day)} ${hm(x.ts)}</td><td>Despesa: ${esc(x.type)}${x.notes?` · ${esc(x.notes)}`:""}</td><td class="fmt" style="color:var(--red)">− ${fmt(x.amount)}</td></tr>`).join("")}
      ${!c.sales.length&&!c.expenses.length?`<tr><td colspan="3" class="muted">Sem movimentos.</td></tr>`:""}
      <tr><td></td><td><b>Vendas cash ${fmt(sIn)} − despesas ${fmt(sOut)}</b></td><td></td></tr></table></div>
    <div class="sec-h"><h3 class="mont">HISTÓRICO DE RECOLHAS</h3></div>
    <div class="card"><table class="t"><tr><th>Data</th><th>Por</th><th>Recolhido</th><th>Contado</th><th>Diferença</th></tr>
      ${c.moves.filter(x=>x.type==="recolha").map(x=>{const dif=x.counted!=null&&x.expected!=null?x.counted-x.expected:null;return `<tr><td class="small">${dmy(x.day)} ${hm(x.ts)}</td><td>${esc(x.by_name||"")}</td><td class="fmt">${fmt(x.amount)}</td><td class="fmt">${x.counted!=null?fmt(x.counted):"—"}</td><td class="fmt" style="color:${dif?"var(--red)":"inherit"}">${dif==null?"—":(dif>0?"+":"")+fmt(dif)}</td></tr>`;}).join("")||`<tr><td colspan="5" class="muted">Ainda sem recolhas.</td></tr>`}</table></div>`;
  $("#rc").onclick=()=>{ const m=document.createElement("div"); m.className="mod";
    m.innerHTML=`<div class="mbox"><div class="row" style="justify-content:space-between"><h2>Recolha de cash</h2><button class="qbtn" data-x>✕</button></div>
      <p class="muted small">O sistema diz que devem estar <b>${fmt(c.balance)}</b> na caixa. Conta o dinheiro e escreve o valor real.</p>
      <label class="l">Valor contado na caixa</label><input class="f" id="ct" inputmode="numeric" value="${c.balance}">
      <p class="small" id="df"></p>
      <label class="l">Valor recolhido</label><input class="f" id="am" inputmode="numeric" value="${c.balance}">

      <button class="btn grn" id="ok" style="width:100%;margin-top:14px">Confirmar e enviar para o grupo</button></div>`;

    $("#ok",m).onclick=async()=>{ const counted=+$("#ct",m).value.replace(/\D/g,""), amount=+$("#am",m).value.replace(/\D/g,""), notes=$("#nt",m).value;

        if(w) w.location="https://wa.me/?text="+encodeURIComponent(t); m.remove(); toast("Recolha registada"); vCaixa(v);
      }catch(e){ if(w) w.close(); toast(e.message); } };
    document.body.appendChild(m); };
}

/* ----- logística ----- */
const daysBetween=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
const usd=n=>{ const v=Math.round((+n||0)*100)/100, [i,d]=v.toFixed(2).split("."); return "$"+i.replace(/\B(?=(\d{3})+(?!\d))/g,".")+(d!=="00"?","+d:""); };
async function vLog(v){
  S.lf=S.lf||"curso"; S.lq=S.lq||""; S.lb=S.lb||"";
  v.innerHTML=`<div class="wrap"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px"><h2 style="margin:0;font-size:18px">Logística</h2><button class="btn" id="lnew">+ Encomenda</button></div><div id="lb"><p class="empty">A carregar…</p></div></div>`;
  $("#lnew").onclick=()=>logModal(null,()=>vLog(v));
  let rows; try{ rows=(await api("/logistics")).rows; }catch(e){ $("#lb").innerHTML=`<p class="empty">${esc(e.message)}</p>`; return; }
  const year=S.today.slice(0,4), open=rows.filter(r=>r.status!=="Recebido"), yr=rows.filter(r=>(r.order_day||"").startsWith(year));
  const invY=yr.reduce((a,r)=>a+(r.mzn||0)+(r.pickup||0),0), usdY=yr.reduce((a,r)=>a+(r.usd||0),0);
  const pk=rows.filter(r=>r.pickup&&r.mzn), pkPct=pk.length?pk.reduce((a,r)=>a+r.pickup,0)/pk.reduce((a,r)=>a+r.mzn,0)*100:0;
  const avgDays=via=>{const x=rows.filter(r=>r.via===via&&r.status==="Recebido"&&r.order_day&&r.arrival_day).map(r=>daysBetween(r.order_day,r.arrival_day)).filter(d=>d>=0);return x.length?Math.round(x.reduce((a,b)=>a+b,0)/x.length):null;};
  const air=avgDays("Aérea"), sea=avgDays("Marítima");
  const draw=()=>{ const q=norm(S.lq).trim();
    const list=rows.filter(r=>(S.lf==="todas"||(S.lf==="curso"?r.status!=="Recebido":r.status==="Recebido"))&&(!S.lb||r.brand===S.lb)&&(!q||norm(r.name+" "+(r.supplier||"")+" "+(r.tracking||"")).includes(q)));
    const groups={}; list.forEach(r=>{const k=(r.order_day||"").slice(0,7)||"—";(groups[k]=groups[k]||[]).push(r);});
    const stTag=st=>`<span class="tag" style="${st==="Recebido"?"background:#e6f4ea;color:var(--grn)":st==="Chegou (por levantar)"?"background:#fff3cd;color:#8a6d00":st==="Em trânsito"?"background:#e3eefc;color:#1a56b0":"background:#fde8e8;color:var(--red)"}">${esc(st||"")}</span>`;
    $("#ll").innerHTML=Object.entries(groups).map(([k,rs])=>{ const [y,mo]=k.split("-"); const nm=k==="—"?"Sem data":new Date(Date.UTC(+y,+mo-1,15)).toLocaleDateString("pt-PT",{month:"long",year:"numeric"});
      return `<div class="sec-h"><h3 class="mont">${esc(nm.toUpperCase())}</h3><span class="small muted">${fmt(rs.reduce((a,r)=>a+(r.mzn||0),0))} · ${usd(rs.reduce((a,r)=>a+(r.usd||0),0))}</span></div>
      <div class="card" style="overflow-x:auto"><table class="t"><tr><th>Encomenda</th><th>Estado</th><th>Via</th><th>Encomendado</th><th>Chegada</th><th>MZN</th><th>USD</th><th>Levantamento</th></tr>
      ${rs.map(r=>`<tr data-l="${r.id}" style="cursor:pointer"><td><b>${esc(r.name)}</b>${r.has_file?" 📎":""}${r.brand?` <span class="tag">${esc(r.brand)}</span>`:""}${r.supplier?`<div class="small muted">${esc(r.supplier)}</div>`:""}</td><td>${stTag(r.status)}</td><td class="small">${r.via==="Aérea"?"✈️ Aérea":r.via==="Marítima"?"🚢 Marítima":esc(r.via||"")}</td><td class="small">${r.order_day?dmy(r.order_day):"—"}</td><td class="small">${r.arrival_day?dmy(r.arrival_day)+(r.order_day&&r.status==="Recebido"?` <span class="muted">(${daysBetween(r.order_day,r.arrival_day)}d)</span>`:""):"—"}</td><td class="fmt">${r.mzn!=null?fmt(r.mzn):"—"}${r.pay_method?`<div class="small muted">${esc(r.pay_method)}</div>`:""}</td><td class="fmt">${r.usd!=null?usd(r.usd):"—"}</td><td class="fmt">${r.pickup!=null?fmt(r.pickup):"—"}${r.pickup_method?`<div class="small muted">${esc(r.pickup_method)}</div>`:""}</td></tr>`).join("")}</table></div>`; }).join("")||`<p class="empty">Nada para mostrar.</p>`;
    $$("[data-l]").forEach(t=>t.onclick=()=>logModal(rows.find(r=>r.id===+t.dataset.l),()=>vLog(v)));
  };
  $("#lb").innerHTML=`<div class="kpis" style="margin-top:12px">
      <div class="kpi" style="border-color:var(--ink)"><small>Em curso</small><b>${open.length} encomendas</b><div class="small muted">${fmt(open.reduce((a,r)=>a+(r.mzn||0),0))} · ${usd(open.reduce((a,r)=>a+(r.usd||0),0))}</div></div>
      <div class="kpi"><small>Investido em ${year}</small><b>${fmt(invY)}</b><div class="small muted">${usd(usdY)} + levantamentos</div></div>
      <div class="kpi"><small>Levantamento médio</small><b>${pkPct.toFixed(0)}%</b><div class="small muted">do valor da encomenda</div></div>
      <div class="kpi"><small>Tempo de entrega</small><b>✈️ ${air??"—"}d · 🚢 ${sea??"—"}d</b><div class="small muted">média até receber</div></div></div>
    <div class="srch"><input id="lq" placeholder="Pesquisar encomenda, fornecedor, tracking…" value="${esc(S.lq)}">
      <div class="cats">${[["curso","Em curso"],["recebidas","Recebidas"],["todas","Todas"]].map(([k,l])=>`<button class="chip ${S.lf===k?"on":""}" data-lf="${k}">${l}</button>`).join("")}<span style="width:10px"></span>${["",...LBRAND].map(b=>`<button class="chip ${S.lb===b?"on":""}" data-lb="${b}">${b||"Todas as marcas"}</button>`).join("")}</div></div>
    <div id="ll"></div>`;
  $("#lq").oninput=e=>{S.lq=e.target.value;draw();};
  $$("[data-lf]").forEach(b=>b.onclick=()=>{S.lf=b.dataset.lf;$$("[data-lf]").forEach(x=>x.classList.toggle("on",x===b));draw();});
  $$("[data-lb]").forEach(b=>b.onclick=()=>{S.lb=b.dataset.lb;$$("[data-lb]").forEach(x=>x.classList.toggle("on",x===b));draw();});
  draw();
}
function logModal(r,after){

  m.innerHTML=`<div class="mbox"><div class="row" style="justify-content:space-between"><h2>${isNew?"Nova encomenda":"Encomenda"}</h2><button class="qbtn" data-x>✕</button></div>
    <label class="l">Nome</label><input class="f" id="l_name" value="${esc(r.name)}" placeholder="ex: 100 Cubans 8mm (Gold)">
    <label class="l">Estado</label><div class="opts">${LSTAT.map(x=>`<button class="opt ${st===x?"on":""}" data-st="${esc(x)}">${esc(x)}</button>`).join("")}</div>

    <div class="row" style="gap:10px"><div style="flex:1"><label class="l">Data da encomenda</label><input class="f" type="date" id="l_order_day" value="${esc(r.order_day||"")}"></div><div style="flex:1"><label class="l">Data de chegada</label><input class="f" type="date" id="l_arrival_day" value="${esc(r.arrival_day||"")}"></div></div>
    <div class="row" style="gap:10px"><div style="flex:1"><label class="l">USD</label><input class="f" id="l_usd" inputmode="decimal" value="${r.usd??""}"></div><div style="flex:1"><label class="l">MZN</label><input class="f" id="l_mzn" inputmode="numeric" value="${r.mzn??""}"></div><div style="flex:1"><label class="l">Levantamento (MZN)</label><input class="f" id="l_pickup" inputmode="numeric" value="${r.pickup??""}"></div></div>

    <div class="row" style="gap:10px"><div style="flex:1"><label class="l">Pagamento da encomenda</label><select class="f" id="l_pay_method"><option value="">—</option>${LPAY.map(p=>`<option ${r.pay_method===p?"selected":""}>${p}</option>`).join("")}</select></div><div style="flex:1"><label class="l">Pagamento do levantamento</label><select class="f" id="l_pickup_method"><option value="">—</option>${LPAY.map(p=>`<option ${r.pickup_method===p?"selected":""}>${p}</option>`).join("")}</select></div></div>

    ${!isNew&&r.status!=="Recebido"?`<button class="btn grn" id="lrcv" style="width:100%;margin-top:14px">✓ Marcar como recebido hoje</button>`:""}

async function vGastos(v){

function shrinkImage(file){ return new Promise((res,rej)=>{ const img=new Image(); const u=URL.createObjectURL(file);
  img.onload=()=>{ const k=Math.min(1,1280/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",0.7)); };
  img.onerror=()=>rej(new Error("Não consegui ler a foto")); img.src=u; }); }

function clockModal(){
  const m=document.createElement("div"); m.className="mod"; let pin="";

  const padView=()=>{ m.innerHTML=`<div class="mbox" style="max-width:360px;text-align:center"><div class="row" style="justify-content:space-between"><h2>🕘 Ponto</h2><button class="qbtn" data-x>✕</button></div><p class="muted small">Introduz o teu PIN</p><div class="dots" id="cd"></div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9,"⌫",0,"OK"].map(k=>`<button data-c="${k}">${k}</button>`).join("")}</div><div class="lerr" id="ce"></div></div>`;
    const draw=()=>{$("#cd",m).innerHTML=Array.from({length:Math.max(4,pin.length)},(_,i)=>`<i class="${i<pin.length?"f":""}"></i>`).join("");};
    const go=async()=>{ if(pin.length<4) return; try{ const st=await clockApi({pin,action:"status"}); confirmView(st); }catch(e){ $("#ce",m).textContent=e.message; pin=""; draw(); } };
    $$("[data-c]",m).forEach(b=>b.onclick=()=>{const k=b.dataset.c; if(k==="⌫") pin=pin.slice(0,-1); else if(k==="OK") return go(); else if(pin.length<8) pin+=k; $("#ce",m).textContent=""; draw();});
    document.onkeydown=e=>{ if(/^\d$/.test(e.key)&&pin.length<8){pin+=e.key;draw();} else if(e.key==="Backspace"){pin=pin.slice(0,-1);draw();} else if(e.key==="Enter") go(); else if(e.key==="Escape") close(); };
    $("[data-x]",m).onclick=close; draw(); };
  const confirmView=st=>{ document.onkeydown=null;
    m.innerHTML=`<div class="mbox" style="max-width:360px;text-align:center"><h2>Olá, ${esc(st.name)}</h2><p class="muted">${st.open?`Entrada marcada às <b>${hm(st.in_ts)}</b>`:"Ainda não marcaste entrada hoje"}</p>

    $("[data-x]",m).onclick=close;
    $("#cgo",m).onclick=async e=>{ e.target.disabled=true; try{ const r=await clockApi({pin}); doneView(r); }catch(err){ toast(err.message); close(); } }; };
  const doneView=r=>{ const msg=r.action==="entrada"?(r.late?`<p style="color:var(--red);font-weight:600">Atraso de ${hmFmt(r.late)}</p>`:r.scheduled?`<p style="color:var(--grn);font-weight:600">A horas ✓</p>`:""):`<p class="muted">Trabalhaste ${hmFmt(r.worked)} hoje.</p>${r.extra?`<p style="color:var(--grn);font-weight:600">+ ${hmFmt(r.extra)} de horas extra</p>`:""}${r.early?`<p style="color:var(--red);font-weight:600">Saída ${hmFmt(r.early)} antes do horário</p>`:""}`;
    m.innerHTML=`<div class="mbox ok" style="max-width:360px"><div class="big">${r.action==="entrada"?"👋":"✅"}</div><h2>${r.action==="entrada"?"Entrada":"Saída"} registada às ${hm(r.ts)}</h2><p>${esc(r.name)}</p>${msg}<button class="btn" style="width:100%;margin-top:10px" data-x>OK</button></div>`;
    $("[data-x]",m).onclick=close; setTimeout(()=>{ if(document.body.contains(m)) close(); },6000); };
  m.onclick=e=>{if(e.target===m)close();};
  document.body.appendChild(m); padView();
}

      <button class="btn" id="ss" style="width:100%;margin-top:14px">Guardar</button>${sh?`<button class="btn sec" id="sx" style="width:100%;margin-top:8px;color:var(--red)">Apagar registo</button>`:""}</div>`;
    $("[data-x]",m).onclick=()=>m.remove(); m.onclick=e=>{if(e.target===m)m.remove();};
    $("#ss",m).onclick=async()=>{ const body={user_id:r.id,day:$("#sd",m).value,in:$("#si",m).value,out:$("#so",m).value,note:$("#sn",m).value}; try{ if(sh) await api("/shifts/"+sh.id,{method:"PUT",body}); else await api("/shifts",{method:"POST",body}); m.remove(); toast("Ponto guardado"); after(); }catch(e){toast(e.message);} };
    const sx=$("#sx",m); if(sx) sx.onclick=async()=>{ if(!confirmBox("Apagar este registo?")) return; try{ await api("/shifts/"+sh.id,{method:"DELETE"}); m.remove(); after(); }catch(e){toast(e.message);} };
    document.body.appendChild(m); };
  $$("[data-es]",el).forEach(b=>b.onclick=()=>edit(all.find(z=>z.id===+b.dataset.es),b.dataset.day));
  $$("[data-new]",el).forEach(b=>b.onclick=()=>edit(null,b.dataset.new));
  $("#padd").onclick=()=>edit(null,S.today);
  el.scrollIntoView({behavior:"smooth"});
}

/* ----- stock ----- */
function stockRows(){
  const rows=[]; S.products.forEach(p=>{ const cors=p.mats?["ouro","prata"]:["-"], sz=p.sizes.length?p.sizes:["-"]; cors.forEach(c=>sz.forEach(s=>rows.push({p,cor:c,size:s}))); }); return rows;
}
function vStock(v){
  const admin=S.user.role==="admin";
  const chg={};
  v.innerHTML=`<div class="wrap"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px"><h2 style="margin:0;font-size:18px">Stock</h2>
    ${admin?`<div class="row"><button class="btn sec" id="imp">Importar da Google Sheet</button><button class="btn" id="sv" disabled>Guardar alterações</button></div>`:""}</div>
    <div class="srch" style="margin-top:10px"><input id="sq" placeholder="Filtrar (ex: grego, cuban 3, rope)"><div class="cats"><button class="chip on" data-f="all">Todos</button><button class="chip" data-f="low">Stock baixo (1–5)</button><button class="chip" data-f="zero">Esgotados</button><button class="chip" data-f="none">Sem contagem</button></div></div>
    <div class="card"><div class="sr small muted" style="font-weight:700"><span>Artigo</span><span>Cor</span><span>Tam.</span><span style="text-align:center">Qtd</span></div><div id="sl"></div></div></div>`;
  let f="all";
  const draw=()=>{ const q=norm($("#sq").value).trim().split(/\s+/).filter(Boolean);
    const rows=stockRows().filter(r=>{ const n=stk(r.p.id,r.cor,r.size); if(f==="low"&&!(n>0&&n<=5))return false; if(f==="zero"&&n!==0)return false; if(f==="none"&&n!=null)return false; return q.every(w=>norm(r.p.name+" "+r.p.cat+" "+r.p.id).includes(w)); }).slice(0,400);
    $("#sl").innerHTML=rows.map(r=>{const k=`${r.p.id}|${r.cor}|${r.size}`; const n=k in chg?chg[k]:stk(r.p.id,r.cor,r.size);
      return `<div class="sr"><span>${esc(r.p.name)}</span><span>${CORS[r.cor]||"—"}</span><span>${r.size==="-"?"—":esc(r.size)}</span>${admin?`<input data-k="${esc(k)}" inputmode="numeric" value="${n==null?"":n}" class="${n!=null&&n<=5?"low":""} ${k in chg?"chg":""}">`:`<b style="text-align:center" class="${n!=null&&n<=5?"":""}">${n==null?"—":n}</b>`}</div>`;}).join("")||`<p class="empty">Nada para mostrar.</p>`;
    $$("#sl input").forEach(i=>i.oninput=()=>{chg[i.dataset.k]=i.value.replace(/\D/g,""); i.classList.add("chg"); $("#sv").disabled=false; $("#sv").textContent=`Guardar ${Object.keys(chg).length} alterações`;});
  };
  $("#sq").oninput=draw;
  $$("[data-f]").forEach(b=>b.onclick=()=>{f=b.dataset.f;$$("[data-f]").forEach(x=>x.classList.toggle("on",x===b));draw();});
  if(admin){
    $("#sv").onclick=async()=>{ const rows=Object.entries(chg).map(([k,q])=>{const [product_id,cor,size]=k.split("|");return {product_id,cor,size,qty:q};});
      try{ await api("/stock",{method:"PUT",body:{rows,reason:"ajuste manual"}}); rows.forEach(r=>S.stock[`${r.product_id}|${r.cor}|${r.size}`]=r.qty===""?null:+r.qty); Object.keys(chg).forEach(k=>delete chg[k]); toast(`${rows.length} linhas guardadas`); $("#sv").disabled=true; $("#sv").textContent="Guardar alterações"; draw(); }catch(e){toast(e.message);} };
    $("#imp").onclick=async()=>{ const url=prompt("Link CSV publicado da Google Sheet:", S.settings.sheet_csv||"https://docs.google.com/spreadsheets/d/e/2PACX-1vQaeK8QR0Hl9GQqk4Vd10bf8aZYNkBZ90YGSDx2cYAnVocdkwpX-2nOUqkZRA7weuCrnT7449mTXZwP/pub?gid=0&single=true&output=csv"); if(!url) return;
      if(!confirmBox("Isto substitui o stock do sistema pelos números da Google Sheet. Continuar?")) return;
      try{ const r=await api("/stock/import",{method:"POST",body:{url}}); await boot(); toast(`Importadas ${r.n} linhas (${r.withQty} com quantidade)`); vStock(v);}catch(e){toast(e.message);} };
  }
  draw();
}

/* ----- relatório ----- */
async function vRel(v){
  const to=S.today, d=new Date(Date.parse(to)-6*864e5).toISOString().slice(0,10);
  v.innerHTML=`<div class="wrap"><div class="row" style="flex-wrap:wrap;gap:10px"><h2 style="margin:0;font-size:18px;flex:1">Relatório</h2><input type="date" class="f" id="rf" value="${S.rf||d}" style="width:auto"><span>até</span><input type="date" class="f" id="rt" value="${S.rt||to}" style="width:auto"></div><div id="rb"><p class="empty">A carregar…</p></div></div>`;
  const load=async()=>{ S.rf=$("#rf").value; S.rt=$("#rt").value; try{ const r=await api(`/report?from=${S.rf}&to=${S.rt}`);
    const tot=r.byDay.reduce((a,x)=>a+x.total,0), n=r.byDay.reduce((a,x)=>a+x.n,0);
    $("#rb").innerHTML=`<div class="kpis" style="margin-top:12px"><div class="kpi"><small>Vendas</small><b>${fmt(tot)}</b></div><div class="kpi"><small>Nº vendas</small><b>${n}</b></div><div class="kpi"><small>Ticket médio</small><b>${fmt(n?tot/n:0)}</b></div></div>
      <div class="card"><div class="sec-h" style="margin-top:0"><h3 class="mont">POR DIA</h3></div><table class="t"><tr><th>Dia</th><th>Vendas</th><th>Total</th><th>Transporte</th></tr>${r.byDay.map(x=>`<tr><td>${dmy(x.day)}</td><td>${x.n}</td><td class="fmt">${fmt(x.total)}</td><td class="fmt">${fmt(x.delivery)}</td></tr>`).join("")||`<tr><td colspan="4" class="muted">Sem vendas.</td></tr>`}</table>
      <div class="sec-h"><h3 class="mont">MAIS VENDIDOS</h3></div><table class="t"><tr><th>Artigo</th><th>Qtd</th><th>Total</th></tr>${r.top.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td class="fmt">${fmt(x.total)}</td></tr>`).join("")}</table>
      <div class="sec-h"><h3 class="mont">POR VENDEDOR</h3></div><table class="t"><tr><th>Vendedor</th><th>Vendas</th><th>Total</th></tr>${r.bySeller.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.n}</td><td class="fmt">${fmt(x.total)}</td></tr>`).join("")}</table></div>`;
  }catch(e){ $("#rb").innerHTML=`<p class="empty">${esc(e.message)}</p>`; } };
  $("#rf").onchange=load; $("#rt").onchange=load; load();
}

/* ----- equipa ----- */
function vEquipa(v){
  v.innerHTML=`<div class="wrap"><h2 style="margin:0 0 12px;font-size:18px">Equipa</h2>
    <div class="card" style="overflow-x:auto"><table class="t"><tr><th>Nome</th><th>Função</th><th>Comissão</th><th>Estado</th><th></th></tr>
    ${S.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${ROLES[u.role]||u.role}</td><td>${u.commission}%</td><td>${u.active?"Ativo":"<span class='muted'>Inativo</span>"}</td><td><button class="chip" data-ed="${u.id}">Editar</button></td></tr>`).join("")}</table></div>
    <div class="sec-h"><h3 class="mont">ADICIONAR PESSOA</h3></div>
    <div class="card"><div class="row" style="flex-wrap:wrap;gap:10px"><input class="f" id="nn" placeholder="Nome" style="flex:2;min-width:140px"><input class="f" id="np" placeholder="PIN (4–8 dígitos)" inputmode="numeric" style="flex:1;min-width:120px"><input class="f" id="nc" placeholder="Comissão %" inputmode="decimal" value="3" style="flex:1;min-width:100px"><select class="f" id="nr" style="flex:1;min-width:120px">${Object.entries(ROLES).map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select><button class="btn" id="nb">Adicionar</button></div>
    <p class="small muted">Cada pessoa entra com o seu PIN. A venda fica registada em nome de quem está ligado. Gerente: controla a caixa (recolhas de cash), anula vendas e apaga despesas. Admin: tudo, incluindo stock, relatórios e equipa.</p></div></div>`;
  const devBox=document.createElement("div"); v.querySelector(".wrap").appendChild(devBox);
  const drawDev=async()=>{ let ds=[]; try{ ds=(await api("/devices")).rows.filter(x=>x.active); }catch(e){}
    const mine=LS.get("posDevice",null);
    devBox.innerHTML=`<div class="sec-h"><h3 class="mont">PONTO · TABLET DA LOJA</h3></div><div class="card">
      <p class="small">${mine?`<b style="color:var(--grn)">✓ Este dispositivo está autorizado a marcar ponto.</b>`:`Este dispositivo <b>não</b> está autorizado a marcar ponto.`}</p>
      ${mine?`<button class="btn sec" id="dvoff">Retirar autorização deste dispositivo</button>`:`<button class="btn" id="dvon">Autorizar este dispositivo como tablet da loja</button>`}
      <p class="small muted" style="margin-top:10px">Faz isto <b>só no tablet que fica na loja</b>. As funcionárias marcam entrada e saída nele com o PIN (botão “🕘 Ponto”). Noutros telemóveis não é possível.</p>
      ${ds.length?`<p class="small muted">Dispositivos autorizados: ${ds.map(x=>`${esc(x.name)} (${new Date(x.created).toLocaleDateString("pt-PT")}) <button class="chip" data-dv="${x.short}">Revogar</button>`).join(" ")}</p>`:""}
      <label class="l">Tolerância de atraso (minutos)</label><div class="row"><input class="f" id="tol" inputmode="numeric" value="${S.settings.late_tolerance??10}" style="max-width:120px"><button class="btn sec" id="tolsv">Guardar</button></div></div>`;
    const on=$("#dvon"); if(on) on.onclick=async()=>{ const name=prompt("Nome deste dispositivo:","Tablet da loja"); if(name==null) return; try{ const r=await api("/devices",{method:"POST",body:{name}}); LS.set("posDevice",r.token); toast("Tablet autorizado"); drawDev(); }catch(e){toast(e.message);} };
    const off=$("#dvoff"); if(off) off.onclick=async()=>{ if(!confirmBox("Retirar a autorização deste dispositivo?")) return; try{ await api("/devices/"+mine.slice(0,6),{method:"DELETE"}); }catch(e){} LS.set("posDevice",null); drawDev(); };
    $$("[data-dv]",devBox).forEach(b=>b.onclick=async()=>{ if(!confirmBox("Revogar este dispositivo?")) return; await api("/devices/"+b.dataset.dv,{method:"DELETE"}); if(mine&&mine.startsWith(b.dataset.dv)) LS.set("posDevice",null); drawDev(); });
    $("#tolsv").onclick=async()=>{ try{ await api("/settings",{method:"PUT",body:{late_tolerance:+$("#tol").value.replace(/\D/g,"")||0}}); S.settings.late_tolerance=$("#tol").value; toast("Tolerância guardada"); }catch(e){toast(e.message);} };
  };
  if(S.user.role==="admin") drawDev();
  $("#nb").onclick=async()=>{ try{ await api("/users",{method:"POST",body:{name:$("#nn").value,pin:$("#np").value,commission:+$("#nc").value.replace(",","."),role:$("#nr").value}}); await boot(); toast("Pessoa adicionada"); vEquipa(v);}catch(e){toast(e.message);} };
  $$("[data-ed]").forEach(b=>b.onclick=()=>{ const u=S.users.find(x=>x.id===+b.dataset.ed); const m=document.createElement("div"); m.className="mod";
    m.innerHTML=`<div class="mbox"><div class="row" style="justify-content:space-between"><h2>${esc(u.name)}</h2><button class="qbtn" data-x>✕</button></div>
      <label class="l">Nome</label><input class="f" id="un" value="${esc(u.name)}"><label class="l">Novo PIN (deixa vazio para manter)</label><input class="f" id="up" inputmode="numeric">
      <label class="l">Comissão %</label><input class="f" id="uc" value="${u.commission}" inputmode="decimal"><label class="l">Função</label><select class="f" id="ur">${Object.entries(ROLES).map(([k,l])=>`<option value="${k}" ${u.role===k?"selected":""}>${l}</option>`).join("")}</select>
      <label class="l">Estado</label><select class="f" id="ua"><option value="1" ${u.active?"selected":""}>Ativo</option><option value="0" ${u.active?"":"selected"}>Inativo (não consegue entrar)</option></select>
      <label class="l">Horário de trabalho (vazio = folga)</label><div id="sch" class="small muted">A carregar…</div>
      <label class="l">Valor da hora extra (MT)</label><input class="f" id="uot" inputmode="numeric" value="${u.ot_rate||""}" placeholder="ex: 100">
      <button class="btn" id="usv" style="width:100%;margin-top:14px">Guardar</button></div>`;
    $("[data-x]",m).onclick=()=>m.remove(); m.onclick=e=>{if(e.target===m)m.remove();};
    api(`/users/${u.id}/schedule`).then(r=>{ const by={}; r.rows.forEach(x=>by[x.dow]=x);
      $("#sch",m).innerHTML=[1,2,3,4,5,6,0].map(d=>`<div class="row" style="gap:8px;margin:4px 0"><span style="width:70px">${DOWS[d]}</span><input class="f" type="time" data-ds="${d}" value="${by[d]?by[d].start:""}" style="padding:7px"><span>–</span><input class="f" type="time" data-de="${d}" value="${by[d]?by[d].end:""}" style="padding:7px"></div>`).join("")+`<button class="chip" id="cpy" style="margin-top:4px">Copiar segunda para todos os dias úteis</button>`;
      $("#cpy",m).onclick=()=>{ const s=$('[data-ds="1"]',m).value, e=$('[data-de="1"]',m).value; [2,3,4,5,6].forEach(d=>{$(`[data-ds="${d}"]`,m).value=s;$(`[data-de="${d}"]`,m).value=e;}); };
    }).catch(()=>{$("#sch",m).textContent="—";});
    $("#usv",m).onclick=async()=>{ const body={name:$("#un",m).value,commission:+$("#uc",m).value.replace(",","."),role:$("#ur",m).value,active:+$("#ua",m).value}; if($("#up",m).value) body.pin=$("#up",m).value;
      try{ await api(`/users/${u.id}`,{method:"PUT",body});
        if($("[data-ds]",m)){ const rows=[0,1,2,3,4,5,6].map(d=>({dow:d,start:$(`[data-ds="${d}"]`,m).value,end:$(`[data-de="${d}"]`,m).value})).filter(x=>x.start&&x.end); await api(`/users/${u.id}/schedule`,{method:"PUT",body:{rows,ot_rate:+$("#uot",m).value.replace(/\D/g,"")||0}}); }
        await boot(); m.remove(); toast("Guardado"); vEquipa(v);}catch(e){toast(e.message);} };
    document.body.appendChild(m); });
}

render();
</script>
</body>
</html>
